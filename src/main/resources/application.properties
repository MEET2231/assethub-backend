server.port=${PORT:5000}
spring.application.name=assethub-backend

# Security & JWT configuration
jwt.secret=${JWT_SECRET:dev-secret-super-secure-key-for-assethub-jwt-tokens-256bit}
jwt.expiration-hours=12

# Database connection:
# 1. DATABASE_URL (Node.js style, e.g. postgres://postgres:password@localhost:5432/assetflow or supabase)
# 2. Or standard SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# 3. If neither provided, falls back to embedded H2 for seamless zero-setup testing
database.url=postgresql://postgres.eqbflrclicsjvbhvdvfj:Assethub%40123@aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# CORS
cors.allowed-origins=${CORS_ORIGIN:*}

# Database initialization controlled by DatabaseConfig
spring.sql.init.mode=never

# Logging
logging.level.com.assethub=INFO
logging.level.org.springframework.web=INFO
